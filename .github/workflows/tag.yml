name: Tag release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          case "$version" in
            '' | *[!0-9A-Za-z.+-]*)
              echo "Refusing to tag an unexpected version: $version" >&2
              exit 1
              ;;
          esac
          printf 'value=v%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Create tag when the version is new
        env:
          TAG: ${{ steps.version.outputs.value }}
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists, nothing to do"
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"
