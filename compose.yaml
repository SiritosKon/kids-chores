name: kids-chores

x-api-image: &api-image
  build:
    context: .
    dockerfile: apps/api/Dockerfile
  image: localhost/kids-chores-api:dev

x-api-env: &api-env
  NODE_ENV: development
  TRUST_PROXY_HOPS: 1
  DATABASE_URL: postgresql://app_core:${APP_CORE_PASSWORD}@postgres:5432/kids_chores?schema=core
  VALKEY_URL: redis://:${VALKEY_PASSWORD}@valkey:6379
  REGION: ${REGION}
  PUBLIC_ORIGIN: ${PUBLIC_ORIGIN}
  MIN_CLIENT_VERSION: ${MIN_CLIENT_VERSION}
  LOG_LEVEL: ${LOG_LEVEL}
  AUTH_PROVIDERS: ${AUTH_PROVIDERS:-}
  AUTH_PEPPER: ${AUTH_PEPPER}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-}
  DEV_LOGIN: ${DEV_LOGIN:-false}

services:
  postgres:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_DB: kids_chores
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MIGRATOR_PASSWORD: ${MIGRATOR_PASSWORD}
      APP_CORE_PASSWORD: ${APP_CORE_PASSWORD}
      APP_NOTIFICATIONS_PASSWORD: ${APP_NOTIFICATIONS_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    ports:
      - 127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d kids_chores]
      interval: 5s
      timeout: 3s
      retries: 20

  valkey:
    image: docker.io/valkey/valkey:8-alpine
    command:
      - valkey-server
      - --requirepass
      - ${VALKEY_PASSWORD}
      - --appendonly
      - 'yes'
      - --appendfsync
      - everysec
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
    volumes:
      - valkeydata:/data
    ports:
      - 127.0.0.1:${VALKEY_HOST_PORT:-6380}:6379
    healthcheck:
      test: [CMD, valkey-cli, --no-auth-warning, -a, '${VALKEY_PASSWORD}', ping]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    <<: *api-image
    command: [npm, run, migrate:deploy]
    environment:
      MIGRATOR_DATABASE_URL: postgresql://migrator:${MIGRATOR_PASSWORD}@postgres:5432/kids_chores?schema=core
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    <<: *api-image
    environment: *api-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:3000/v1/meta]
      interval: 5s
      timeout: 3s
      retries: 20

  outbox-relay:
    <<: *api-image
    command: [node, dist/relay.js]
    environment: *api-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy

  notifications:
    build:
      context: .
      dockerfile: apps/notifications/Dockerfile
    image: localhost/kids-chores-notifications:dev
    environment:
      VALKEY_URL: redis://:${VALKEY_PASSWORD}@valkey:6379
      LOG_LEVEL: ${LOG_LEVEL}
    depends_on:
      valkey:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:3001/v1/notifications/health]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: localhost/kids-chores-web:dev
    ports:
      - 127.0.0.1:${WEB_HOST_PORT:-8080}:80
    depends_on:
      api:
        condition: service_healthy
      notifications:
        condition: service_healthy

volumes:
  pgdata:
  valkeydata:
