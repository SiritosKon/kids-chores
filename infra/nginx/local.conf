server {
  listen 80;
  server_name _;
  absolute_redirect off;

  location = / {
    return 302 /kids-chores/;
  }

  location /kids-chores/ {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /kids-chores/index.html;
  }

  location /v1/notifications/ {
    proxy_pass http://notifications:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /v1/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
