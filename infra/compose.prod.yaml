name: kids-chores

x-restart: &restart
  restart: unless-stopped

x-api-image: &api-image
  image: ${REGISTRY:?}/kids-chores-api:${IMAGE_TAG:?}

x-api-env: &api-env
  NODE_ENV: production
  TRUST_PROXY_HOPS: 1
  DATABASE_URL: postgresql://app_core:${APP_CORE_PASSWORD:?}@postgres:5432/kids_chores?schema=core
  VALKEY_URL: redis://:${VALKEY_PASSWORD:?}@valkey:6379
  REGION: eu
  PUBLIC_ORIGIN: https://${DOMAIN:?}
  APP_PATH: /
  MIN_CLIENT_VERSION: ${MIN_CLIENT_VERSION:-0.7.0}
  LOG_LEVEL: info
  GIT_COMMIT: ${IMAGE_TAG}
  AUTH_PROVIDERS: ${AUTH_PROVIDERS:-}
  AUTH_PEPPER: ${AUTH_PEPPER:?}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  TELEGRAM_CLIENT_ID: ${TELEGRAM_CLIENT_ID:-}
  TELEGRAM_CLIENT_SECRET: ${TELEGRAM_CLIENT_SECRET:-}
  WEBAUTHN_RP_ID: ${DOMAIN}
  SMTP_URL: ${SMTP_URL:?}
  MAIL_FROM: ${MAIL_FROM:?}
  S3_ENDPOINT: https://${S3_HOST:?}
  S3_REGION: ${S3_REGION:?}
  S3_BUCKET: ${S3_BUCKET:?}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?}
  EMAIL_SIGN_IN: ${EMAIL_SIGN_IN:-true}
  PWNED_PASSWORDS_URL: ${PWNED_PASSWORDS_URL:-}
  DEV_LOGIN: 'false'

x-backup-env: &backup-env
  PGBACKREST_STANZA: main
  PGBACKREST_PG1_PATH: /var/lib/postgresql/data
  PGBACKREST_PG1_SOCKET_PATH: /var/run/postgresql
  PGBACKREST_REPO1_TYPE: s3
  PGBACKREST_REPO1_S3_ENDPOINT: ${S3_HOST}
  PGBACKREST_REPO1_S3_REGION: ${S3_REGION}
  PGBACKREST_REPO1_S3_BUCKET: ${BACKUP_BUCKET:?}
  PGBACKREST_REPO1_S3_KEY: ${S3_ACCESS_KEY}
  PGBACKREST_REPO1_S3_KEY_SECRET: ${S3_SECRET_KEY}
  PGBACKREST_REPO1_S3_URI_STYLE: path
  PGBACKREST_REPO1_PATH: /pgbackrest
  PGBACKREST_REPO1_RETENTION_FULL: 7
  PGBACKREST_REPO1_CIPHER_TYPE: aes-256-cbc
  PGBACKREST_REPO1_CIPHER_PASS: ${BACKUP_CIPHER_PASS:?}
  PGBACKREST_COMPRESS_TYPE: zst
  PGBACKREST_START_FAST: 'y'
  PGBACKREST_LOG_LEVEL_CONSOLE: info
  PGBACKREST_LOG_LEVEL_FILE: 'off'

x-postgres: &postgres
  image: ${REGISTRY}/kids-chores-postgres:${IMAGE_TAG}

services:
  postgres:
    <<: [*restart, *postgres]
    command:
      - postgres
      - -c
      - archive_mode=on
      - -c
      - archive_command=pgbackrest archive-push %p
      - -c
      - archive_timeout=300
    environment:
      <<: *backup-env
      POSTGRES_DB: kids_chores
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      MIGRATOR_PASSWORD: ${MIGRATOR_PASSWORD:?}
      APP_CORE_PASSWORD: ${APP_CORE_PASSWORD}
      APP_NOTIFICATIONS_PASSWORD: ${APP_NOTIFICATIONS_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
    shm_size: 256mb
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d kids_chores]
      interval: 5s
      timeout: 3s
      retries: 20

  restore-check:
    <<: *postgres
    profiles: [tools]
    user: postgres
    entrypoint: [restore-check]
    environment: *backup-env
    tmpfs:
      - /tmp

  valkey:
    <<: *restart
    image: docker.io/valkey/valkey:8-alpine
    command:
      - valkey-server
      - --requirepass
      - ${VALKEY_PASSWORD}
      - --appendonly
      - 'yes'
      - --appendfsync
      - everysec
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
    volumes:
      - valkeydata:/data
    healthcheck:
      test: [CMD, valkey-cli, --no-auth-warning, -a, '${VALKEY_PASSWORD}', ping]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    <<: *api-image
    command: [npm, run, migrate:deploy]
    environment:
      MIGRATOR_DATABASE_URL: postgresql://migrator:${MIGRATOR_PASSWORD}@postgres:5432/kids_chores?schema=core
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    <<: [*restart, *api-image]
    environment: *api-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:3000/v1/meta]
      interval: 5s
      timeout: 3s
      retries: 20

  outbox-relay:
    <<: [*restart, *api-image]
    command: [node, dist/relay.js]
    environment: *api-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy

  notifications:
    <<: *restart
    image: ${REGISTRY}/kids-chores-notifications:${IMAGE_TAG}
    environment:
      VALKEY_URL: redis://:${VALKEY_PASSWORD}@valkey:6379
      LOG_LEVEL: info
    depends_on:
      valkey:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:3001/v1/notifications/health]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    <<: *restart
    image: ${REGISTRY}/kids-chores-web:${IMAGE_TAG}
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - ${HTTP_PORT:-80}:80
      - ${HTTPS_PORT:-443}:443
      - ${HTTPS_PORT:-443}:443/udp
    volumes:
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      api:
        condition: service_healthy
      notifications:
        condition: service_healthy

volumes:
  pgdata:
  valkeydata:
  caddydata:
  caddyconfig:
